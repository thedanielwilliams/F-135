<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Zent cover">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F10" />
      <stop offset="55%" stop-color="#0b0f1a" />
      <stop offset="100%" stop-color="#121316" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="65%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#00B2FF" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#00B2FF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#00B2FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="30%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#9D7CFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#9D7CFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAEAEA" />
      <stop offset="100%" stop-color="#9fdfff" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B2FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00B2FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#00B2FF" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#glowBlue)" />
  <rect width="1600" height="900" fill="url(#glowPurple)" />
  <rect width="1600" height="900" fill="url(#grid)" />

  <g transform="translate(800, 450)" text-anchor="middle">
    <rect x="-260" y="-155" width="520" height="310" rx="24" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
    <text y="15" font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif" font-size="112" font-weight="700" letter-spacing="2" fill="url(#titleGrad)">Zent</text>
    <rect x="-140" y="52" width="280" height="2" fill="url(#lineGrad)" />
    <text y="92" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="4" fill="#A0A0A0">WEB PLATFORM</text>
  </g>
</svg>

